name: Build VCam

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  THEOS_PACKAGE_SCHEME: rootless

jobs:
  build:
    name: Build iOS Tweak
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz
        timeout-minutes: 10

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos

          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "THEOS_PACKAGE_SCHEME=rootless" >> "$GITHUB_ENV"
          echo "PATH=$HOME/theos/bin:$PATH" >> "$GITHUB_ENV"

          echo "Theos installed:"
          ls -la "$HOME/theos"
        timeout-minutes: 10

      - name: Install iOS SDK
        run: |
          curl -fsSL \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            -o /tmp/sdk.tar.xz

          mkdir -p "$HOME/theos/sdks"

          tar -xf /tmp/sdk.tar.xz \
            -C "$HOME/theos/sdks"

          echo "Installed SDKs:"
          ls -la "$HOME/theos/sdks/"
        timeout-minutes: 10

      - name: Verify build environment
        run: |
          export THEOS=$HOME/theos
          export PATH=$HOME/theos/bin:$PATH

          echo "THEOS=$THEOS"
          echo "THEOS_PACKAGE_SCHEME=$THEOS_PACKAGE_SCHEME"

          echo "Available SDKs:"
          ls -la "$THEOS/sdks/"

          echo "Theos version:"
          git -C "$THEOS" rev-parse --short HEAD

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          export PATH=$HOME/theos/bin:$PATH
          export THEOS_PACKAGE_SCHEME=rootless

          make clean
          make package FINALPACKAGE=1 2>&1

          echo "Build complete."
          echo "Packages:"

          ls -lh packages/ 2>/dev/null || {
            echo "No packages directory found!"
            exit 1
          }

          echo ""
          echo "Generated packages:"
          find packages -maxdepth 1 -name "*.deb" -type f -print
        timeout-minutes: 15

      - name: Verify Debian package
        run: |
          DEB=$(find packages -maxdepth 1 -name "*.deb" -type f | head -1)

          if [ -z "$DEB" ]; then
            echo "No deb found!"
            exit 1
          fi

          echo "Found package:"
          echo "$DEB"

          echo ""
          echo "=== Package filename ==="
          basename "$DEB"

          echo ""
          echo "=== Package archive ==="
          ar t "$DEB"

          echo ""
          echo "=== Control information ==="

          rm -rf /tmp/vcam-deb-check
          mkdir -p /tmp/vcam-deb-check
          cd /tmp/vcam-deb-check

          ar x "$GITHUB_WORKSPACE/$DEB"

          if [ -f control.tar.gz ]; then
            tar -xzf control.tar.gz
          elif [ -f control.tar.xz ]; then
            tar -xJf control.tar.xz
          elif [ -f control.tar.zst ]; then
            tar --zstd -xf control.tar.zst
          else
            echo "Cannot find control archive."
            exit 1
          fi

          echo ""
          echo "=== control ==="
          cat ./control

      - name: Prepare output
        run: |
          rm -rf output
          mkdir -p output

          DEB=$(find packages -maxdepth 1 -name "*.deb" -type f | head -1)

          if [ -z "$DEB" ]; then
            echo "No deb found!"
            exit 1
          fi

          echo "Copying package:"
          echo "$DEB"

          cp "$DEB" output/

          echo ""
          echo "Output files:"
          ls -lh output/

      - name: Extract dylib
        run: |
          DEB=$(find output -maxdepth 1 -name "*.deb" -type f | head -1)

          if [ -z "$DEB" ]; then
            echo "No deb in output!"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting package:"
          echo "$DEB"

          ar x "$DEB" --output extracted 2>/dev/null || true

          if [ -f extracted/data.tar.gz ]; then
            tar -xzf extracted/data.tar.gz -C extracted/
          elif [ -f extracted/data.tar.xz ]; then
            tar -xJf extracted/data.tar.xz -C extracted/
          elif [ -f extracted/data.tar.zst ]; then
            tar --zstd -xf extracted/data.tar.zst -C extracted/
          fi

          echo ""
          echo "Searching for dylib..."

          DYLIB=$(find extracted -name "*.dylib" -type f | head -1)

          if [ -n "$DYLIB" ]; then
            echo "Found dylib:"
            echo "$DYLIB"
            cp "$DYLIB" output/VCam.dylib
          else
            echo "No dylib found in package."
          fi

          echo ""
          echo "Final output:"
          ls -lh output/
        timeout-minutes: 10

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: VCam-deb
          path: output/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: VCam-dylib
          path: output/VCam.dylib
          if-no-files-found: warn
          retention-days: 30
